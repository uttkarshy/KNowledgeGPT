name: Verify Android preview on device
on:
  push:
    branches: [feature/knowledgegpt-android]
    paths: ['qa/android/verify_preview.py', '.github/workflows/android-ui-check.yml']
  workflow_dispatch:
    inputs:
      apk_run_id:
        description: 'Successful APK build run ID'
        default: '45145573270'
permissions:
  actions: read
  contents: read
jobs:
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: KnowledgeGPT-Android-APKs
          path: apk
          run-id: ${{ inputs.apk_run_id || '45145573270' }}
          github-token: ${{ github.token }}
      - name: Verify artifact integrity
        run: cd apk && sha256sum -c SHA256SUMS
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: |
            adb install -r apk/KnowledgeGPT-preview.apk
            python qa/android/verify_preview.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KnowledgeGPT-phone-screens
          path: phone-screens
          retention-days: 7
