name: CI

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
      RUN_DB_TESTS: "1"
      LLM_EMBEDDING_DIMENSIONS: "1536"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install system dependencies (Tesseract OCR)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-hin fonts-dejavu-core

      - name: Install Python dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check app tests

      - name: Initialize and upgrade a clean PostgreSQL database
        working-directory: backend
        run: |
          alembic upgrade 0003_token_version
          python -m tests.migration_smoke seed
          alembic upgrade head
          python -m tests.migration_smoke verify
          alembic current

      - name: Run tests
        working-directory: backend
        run: pytest -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend regression tests
        working-directory: frontend
        run: npm test

      - name: Type-check + build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        run: npm run typecheck && npm run build

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: terraform fmt check
        working-directory: infra/terraform
        run: terraform fmt -check -recursive

      - name: terraform validate (each module)
        working-directory: infra/terraform
        run: |
          for dir in modules/*/; do
            echo "Validating $dir"
            (cd "$dir" && terraform init -backend=false -input=false && terraform validate)
          done
          cd environments/production
          terraform init -backend=false -input=false
          terraform validate

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Local environment and Compose config
        run: |
          cp .env.example .env
          python -c "import secrets; p='.env'; s=open(p).read(); open(p,'w').write(s.replace('JWT_SECRET_KEY=', 'JWT_SECRET_KEY='+secrets.token_hex(32)))"
          docker compose config --quiet
      - name: Clean Docker build
        run: |
          docker compose -p knowledgegpt-ci down -v --remove-orphans
          docker compose -p knowledgegpt-ci build --no-cache
      - name: Boot real local services and verify running source
        run: |
          docker compose -p knowledgegpt-ci up -d --wait --wait-timeout 900
          python scripts/check_container_source.py --project knowledgegpt-ci
      - name: Service diagnostics on failure
        if: failure()
        run: docker compose -p knowledgegpt-ci logs --no-color --tail=120
      - name: Cleanup
        if: always()
        run: docker compose -p knowledgegpt-ci down -v --remove-orphans
